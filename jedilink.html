<!DOCTYPE html>
<html lang="sl-SI">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<title>Jedilnik</title>
</head>
<body>
<header>
<h1 id="naslov">HRANA</h1>
<nav id="kazalo">
<a href="osnovna.html"><button id="domov">DOMOV</button></a>
<button id="jedilnik"><b>JEDILNIK</b></button>
<a href="oNas.html"><button id="oNas">O NAS</button></a>
<a href="kontakt.html"><button id="kontakt">KONTAKT</button></a>
<a href="rezervacija.html"><button id="rezervacija">REZERVACIJA</button></a>
</nav>
</header>
<main>
<section id="slika">
<img src="slike/klobasa.jpg" alt="Narezana klobasa na lesenem krožniku">
<h2 id="naslovJedilnik">JEDILNIK</h2>
</section>
<section id="kategorije">
<button class="kategorija">Začetne jedi</button>
<button class="kategorija">Juhe</button>
<button class="kategorija">Pizze</button>
<button class="kategorija">Testenine</button>
<button class="kategorija">Rižote</button>
<button class="kategorija">Mesne jedi</button>
<button class="kategorija">Morske jedi</button>
<button class="kategorija">Solate</button>
<button class="kategorija">Jedi za najmlajše</button>
<button class="kategorija">Pivo</button>
<button class="kategorija">Brezalkoholne pijače</button>
<button class="kategorija">Sladice</button>
</section>
<section id="jedi" class="besedilo"></section>
<section id="jedi"></section>
</main>
<script>
// Ob kliku na kategorijo prikaži jedi iz baze
fetch('/api/jedi').then(r => r.json()).then(jedi => {
  const seznam = document.getElementById('jedi');
  document.querySelectorAll('.kategorija').forEach(gumb => {
    gumb.onclick = () => {
      seznam.innerHTML = '';
      for (const jed of jedi.filter(j => j.kategorija === gumb.textContent)) {
        const p = document.createElement('p');
        p.textContent = jed.ime + ' – ' + jed.cena.toFixed(2) + ' €';
        seznam.append(p);
      }
    };
  });
});
</script>
<script src="jedilnik.js"></script>
</body>
</html>
